name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        working-directory: tauri

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Validate and apply tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            for (const path of ["package.json", "package-lock.json"]) {
              const doc = JSON.parse(fs.readFileSync(path, "utf8"));
              doc.version = process.env.VERSION;
              if (doc.packages && doc.packages[""]) {
                doc.packages[""].version = process.env.VERSION;
              }
              fs.writeFileSync(path, JSON.stringify(doc, null, 2) + "\n");
            }
            const tauriPath = "src-tauri/tauri.conf.json";
            const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            tauriConfig.version = process.env.VERSION;
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConfig, null, 2) + "\n");
          '
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "/^name = \"hyprtrack-desktop\"$/,/^dependencies = \\[/s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.lock

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - run: npm ci
      - run: npm run test:release
      - name: Build signed Linux release
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing key'; exit 1; }
          npm run release:linux

      - name: Save signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-linux-release
          path: |
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            tauri/src-tauri/target/release/bundle/appimage/latest.json
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/rpm/*.rpm
            tauri/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-linux-release.sh
